[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
fsp-domain = { path = "crates/domain" }
fsp-application = { path = "crates/application" }
fsp-http = { path = "crates/http" }
fsp-storage-postgres = { path = "crates/storage-postgres" }
fsp-integration-pdf = { path = "crates/integration-pdf" }
fsp-integration-email = { path = "crates/integration-email" }
fsp-integration-github = { path = "crates/integration-github" }
fsp-integration-bifrost = { path = "crates/integration-bifrost" }
fsp-integration-fsp-synthetic = { path = "crates/integration-fsp-synthetic" }
fsp-interview-service = { path = "crates/interview-service" }
fsp-github-insights = { path = "crates/github-insights" }
fsp-integration-interview = { path = "crates/integration-interview" }
fsp-integration-speech = { path = "crates/integration-speech" }
base64 = "0.22.1"
axum = { version = "0.8.9", features = ["multipart"] }
krilla = { version = "0.8.2", default-features = false, features = ["simple-text"] }
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["serde"] }
form_urlencoded = "1.2.2"
http-body-util = "0.1.5"
sqlx = { version = "0.8.6", default-features = false, features = [
    "postgres",
    "runtime-tokio-rustls",
    "migrate",
    "macros",
    "chrono",
] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
sha2 = "0.10.9"
hmac = "0.12.1"
getrandom = "0.4.3"
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", features = ["fs", "catch-panic"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.27.0", features = ["v4"] }
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
