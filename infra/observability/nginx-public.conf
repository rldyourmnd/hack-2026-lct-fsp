# Public access was explicitly authorized by the owner on 2026-10-12.
# OpenObserve keeps its native authentication and loopback-only listeners.
map $http_upgrade $fsp_observe_connection {
    default upgrade;
    '' close;
}

map $uri $fsp_observe_login_key {
    default "";
    /auth/login $binary_remote_addr;
}
limit_req_zone $fsp_observe_login_key zone=fsp_observe_login:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name observe.nddev.link;
    server_tokens off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location / {
        return 308 https://observe.nddev.link$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name observe.nddev.link;
    ssl_certificate /etc/letsencrypt/live/observe.nddev.link/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/observe.nddev.link/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    client_max_body_size 4m;

    add_header Strict-Transport-Security "max-age=604800" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location = /metrics {
        return 404;
    }
    location / {
        limit_req zone=fsp_observe_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fsp_observe_connection;
        proxy_hide_header Cache-Control;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
