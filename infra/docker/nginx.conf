# Only anonymous email issuance/verification consume this per-IP budget.
map $uri $fsp_auth_key {
    default "";
    ~^/api/v1/auth/email/(challenges|verify)$ $binary_remote_addr;
}
limit_req_zone $fsp_auth_key zone=fsp_auth:10m rate=5r/m;

map $scheme $fsp_hsts {
    default "";
    https "max-age=604800";
}

map $status $fsp_asset_cache {
    default "no-store";
    ~^(200|206|304)$ "public, max-age=31536000, immutable";
}

# nginx for docker-compose.yml: plain HTTP on 8080, otherwise the same routing as the stand (infra/nginx/fsp-demo.conf).
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 3m;
    include /etc/nginx/fsp-security-headers.conf;

    # Mock controls never leave the container, even if the API process allowed them.
    location ^~ /__mock__ {
        return 404;
    }

    location ^~ /api/v1/ {
        limit_req zone=fsp_auth burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @auth_rate_limited;
        proxy_pass http://127.0.0.1:4010;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_http_version 1.1;
        # Pin the loopback upstream Host; the browser origin is checked separately.
        proxy_set_header Host 127.0.0.1:4010;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/fsp-security-headers.conf;
    }

    location @auth_rate_limited {
        default_type application/json;
        charset utf-8;
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/fsp-security-headers.conf;
        return 429 '{"code":"rate_limited","message":"Слишком много запросов. Повторите через минуту.","requestId":"$request_id","details":[]}';
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control $fsp_asset_cache always;
        include /etc/nginx/fsp-security-headers.conf;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/fsp-security-headers.conf;
    }
}
