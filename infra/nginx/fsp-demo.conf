# Installed by infra/provision.sh; __PUBLIC_HOST__ and __CERT_NAME__ are substituted.
include /etc/nginx/fsp-observability/http*.conf;
# Only anonymous email issuance/verification consume this per-IP budget.
map $uri $fsp_auth_key {
    default "";
    ~^/api/v1/auth/email/(challenges|verify)$ $binary_remote_addr;
}
limit_req_zone $fsp_auth_key zone=fsp_auth:10m rate=5r/m;

map $scheme $fsp_hsts {
    default "";
    https "max-age=604800";
}

map $status $fsp_asset_cache {
    default "no-store";
    ~^(200|206|304)$ "public, max-age=31536000, immutable";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://__PUBLIC_HOST__$request_uri;
    }
}

server {
    listen 443 ssl http2 __DEFAULT_SERVER__;
    listen [::]:443 ssl http2 __DEFAULT_SERVER__;
    server_name __PUBLIC_HOST__;

    ssl_certificate /etc/letsencrypt/live/__CERT_NAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CERT_NAME__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:fsp:10m;
    ssl_session_timeout 1d;

    root /opt/fsp/current/frontend/dist;
    index index.html;
    client_max_body_size 3m;
    server_tokens off;
    include snippets/fsp-security-headers.conf;
    include /etc/nginx/fsp-observability/locations*.conf;

    # HTTPS also serves ACME when Cloudflare redirects an HTTP validation request.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        include snippets/fsp-security-headers.conf;
    }

    # Mock controls never leave the host, even if the API process allowed them.
    location ^~ /__mock__ {
        return 404;
    }

    location ^~ /api/v1/ {
        limit_req zone=fsp_auth burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @auth_rate_limited;
        proxy_pass http://127.0.0.1:4010;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        add_header Cache-Control "no-store" always;
        proxy_http_version 1.1;
        # The API accepts only loopback Host headers; the browser origin is checked separately.
        proxy_set_header Host 127.0.0.1:4010;
        # The contract session cookie is Secure only on the HTTPS stand.
        proxy_cookie_flags fsp_session secure;
        # LLM-backed endpoints may take up to 45 s upstream.
        proxy_read_timeout 60s;
        include snippets/fsp-security-headers.conf;
    }

    location @auth_rate_limited {
        default_type application/json;
        charset utf-8;
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
        include snippets/fsp-security-headers.conf;
        return 429 '{"code":"rate_limited","message":"Слишком много запросов. Повторите через минуту.","requestId":"$request_id","details":[]}';
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control $fsp_asset_cache always;
        include snippets/fsp-security-headers.conf;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include snippets/fsp-security-headers.conf;
    }
}
