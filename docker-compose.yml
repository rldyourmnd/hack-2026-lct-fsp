# The platform in containers: `docker compose up --build`, then http://localhost:8080.
name: fsp-career

services:
  fsp-simulator:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["/usr/local/bin/fsp-simulator"]
    environment:
      FSP_SIMULATOR_HOST: 0.0.0.0
      FSP_SIMULATOR_PORT: 4020
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:4020/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  interview:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["/usr/local/bin/fsp-interview-service"]
    # The whole model turn can take 45 seconds before persistence and response delivery.
    stop_grace_period: 60s
    environment:
      INTERVIEW_HOST: 0.0.0.0
      INTERVIEW_PORT: 4040
      INTERVIEW_API_TOKEN: ${INTERVIEW_API_TOKEN:-demo-interview-token}
      BIFROST_CHAT_URL: ${BIFROST_CHAT_URL_DOCKER:-}
      BIFROST_API_KEY: ${BIFROST_API_KEY:-}
      BIFROST_MODEL: ${BIFROST_MODEL:-}
      INTERVIEW_BIFROST_MODEL: ${INTERVIEW_BIFROST_MODEL:-}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-fsp}
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      PGDATABASE: ${POSTGRES_DB:-fsp}
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FSP_BIND_IP:-127.0.0.1}:${INTERVIEW_PORT:-4040}:4040"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:4040/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fsp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fsp}
      POSTGRES_DB: ${POSTGRES_DB:-fsp}
    ports:
      # localhost-only: local test/admin access via FSP_TEST_DATABASE_URL
      - "127.0.0.1:${FSP_DB_PORT:-5434}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    stop_grace_period: 60s
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      fsp-simulator:
        condition: service_healthy
      interview:
        condition: service_healthy
    environment:
      HOST: 127.0.0.1
      PORT: 4010
      FSP_SIMULATOR_URL: http://fsp-simulator:4020
      DATABASE_URL: postgres://${POSTGRES_USER:-fsp}:${POSTGRES_PASSWORD:-fsp}@db:5432/${POSTGRES_DB:-fsp}
      FSP_AUTH_MODE: ${FSP_AUTH_MODE:-demo}
      FSP_AUTH_KEY: ${FSP_AUTH_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FSP_EMAIL_FROM: ${FSP_EMAIL_FROM:-}
      FSP_SECURE_COOKIE: ${FSP_SECURE_COOKIE:-0}
      FSP_DEMO_EMAIL_CODE: ${FSP_DEMO_EMAIL_CODE:-123456}
      FSP_ALLOWED_ORIGINS: ${FSP_ALLOWED_ORIGINS:-http://localhost:${FSP_PORT:-8080},http://127.0.0.1:${FSP_PORT:-8080}}
      FSP_PUBLIC_WEB_URL: ${FSP_PUBLIC_WEB_URL:-http://localhost:${FSP_PORT:-8080}}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:${FSP_PORT:-8080}/api/v1/integrations/github/callback}
      FSP_INTERVIEW_URL: http://interview:4040
      INTERVIEW_API_TOKEN: ${INTERVIEW_API_TOKEN:-demo-interview-token}
      # Containers cannot reach the host's loopback; BIFROST_CHAT_URL_DOCKER must point at a
      # host-reachable Bifrost (e.g. http://host.docker.internal:4000/v1/chat/completions).
      BIFROST_CHAT_URL: ${BIFROST_CHAT_URL_DOCKER:-}
      BIFROST_API_KEY: ${BIFROST_API_KEY:-}
      BIFROST_MODEL: ${BIFROST_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FSP_BIND_IP:-127.0.0.1}:${FSP_PORT:-8080}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:4010/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    # nginx must drain proxied requests before Compose stops the API it depends on.
    stop_grace_period: 60s
    build:
      context: .
      dockerfile: frontend/Dockerfile
    network_mode: service:api
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pg-data:
