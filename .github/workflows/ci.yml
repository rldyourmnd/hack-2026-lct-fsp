name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Obsolete pull-request heads are cancelled; a running main validation always completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  platform:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-cache@9fead1382c452a6b791a0a9e464ac6ac66537ac3 # v0.6.51
      - name: Install locked dependencies
        run: |
          bun install --cwd mock-server --frozen-lockfile --ignore-scripts
          bun install --cwd contracts/codegen --frozen-lockfile --ignore-scripts
          bun install --cwd frontend --frozen-lockfile --ignore-scripts
      - name: Contract, frontend and mock API
        run: |
          bun run --cwd frontend verify
          bun run --cwd mock-server typecheck
          bun run --cwd mock-server test

  rust:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and verify the PDF extraction sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils bubblewrap apparmor
          sudo bash infra/install-pdf-sandbox.sh
      - name: Select the toolchain pinned by rust-toolchain.toml
        working-directory: backend
        run: rustup toolchain install
      - uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-cache@9fead1382c452a6b791a0a9e464ac6ac66537ac3 # v0.6.51
      - name: Rust formatting, Clippy and library tests
        working-directory: backend
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --lib --locked

  workflows:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-sdk@9fead1382c452a6b791a0a9e464ac6ac66537ac3 # v0.6.51
        with:
          tools: actionlint@1.7.12,zizmor@1.32.0,gitleaks@8.30.1
      - name: Lint and audit workflows
        run: |
          actionlint
          zizmor --offline --no-progress .github
      - name: Scan new pull request commits, or the full history on main
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then
            gitleaks git --no-banner --redact --log-opts="$BASE..$HEAD" .
          else
            gitleaks git --no-banner --redact .
          fi

  gate:
    needs: [platform, rust, workflows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every required job ended as expected
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECTED: '{"platform":"success","rust":"success","workflows":"success"}'
        run: jq -e --argjson want "$EXPECTED" 'map_values(.result) == $want' <<< "$NEEDS"
