name: OpenNetwork checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Install locked dependencies
        run: |
          bun install --cwd mock-server --frozen-lockfile --ignore-scripts
          bun install --cwd contracts/codegen --frozen-lockfile --ignore-scripts
          bun install --cwd frontend --frozen-lockfile --ignore-scripts
      - name: Contract, frontend and mock API
        run: |
          bun run --cwd frontend verify
          bun run --cwd mock-server typecheck
          bun run --cwd mock-server test
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install and verify the PDF extraction sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils bubblewrap apparmor
          sudo bash infra/install-pdf-sandbox.sh
      - name: Pinned Rust formatting, Clippy and library tests
        working-directory: backend
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --lib
  secret-scan:
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/secret-scan.yml@93eeb2a65e98a29e9dbff7909f67c6419abff046
  actionlint:
    uses: NDDev-Technocracy-Archive/ci-workflows-20261014/.github/workflows/actionlint.yml@93eeb2a65e98a29e9dbff7909f67c6419abff046
